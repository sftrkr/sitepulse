[package]
name = "sitepulse"
version = "0.1.0"
edition = "2021"
description = "CLI tool to check sitemap URLs for status, redirects, and response times"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
hickory-resolver = "0.24"
flate2 = "1.0"
quick-xml = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
tiny_http = "0.12"
